[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srp-backend"
version = "0.1.0"
description = "股票研报聚合平台 backend (FastAPI + AkShare ingestion)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10,<4.0",
    "akshare>=1.15.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "cachetools>=5.3",
    "python-dateutil>=2.8",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
