<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="股票研报聚合平台 — 研报/评级/行情/财务/股指期货期权聚合" />
    <title>股票研报聚合平台</title>
  </head>
  <body>
    <script>
      // Pre-paint theme: apply persisted mode before React mounts to avoid a flash.
      try {
        var ui = JSON.parse(localStorage.getItem("srp.ui") || "{}");
        var dark = (ui.mode || "light") === "dark";
        document.body.dataset.theme = dark ? "dark" : "light";
        document.body.style.background = dark ? "#000" : "#e9ebef";
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
