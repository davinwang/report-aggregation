# Deployment stack: frontend (nginx serving the built SPA + reverse proxy),
# backend (FastAPI + ingestion scheduler). SQLite is the only database; the
# pickle-based in-process cache replaces Redis.
#
# Usage (from the repo root):
#   cd deploy && docker compose up -d --build
#     Frontend UI:  http://localhost:19732
#     API docs:     http://localhost:19731/docs
#     Deep health:  http://localhost:19732/health/deep
#     MCP 端点:     http://localhost:19731/mcp/  (或经前端: http://localhost:19732/mcp/)
#
# First-time data: the backend auto-seeds an empty database on boot (INGEST_BOOTSTRAP,
# runs every feed group once) and then keeps data fresh via frequency-based cron jobs:
# intraday (盘中) / daily_close / daily_evening / weekly_master / weekly_financials —
# each overridable via SCHEDULER_CRON_* below. Manual runs remain possible:
#   docker compose exec backend python -m app.ingestion.pipeline --group daily_close
#   docker compose exec backend python -m app.ingestion.pipeline --all --universe hs300
#
# The backend creates the schema + default users (admin/admin123, analyst/analyst123)
# on boot. All settings below can be overridden via a root .env file or the shell
# environment (JWT_SECRET, FRONTEND_PORT, BACKEND_PORT, ...). Set AUTH_ENABLED=true
# to require JWT login.

# name: srp

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: srp-backend:latest
    container_name: srp-backend
    environment:
      ENV: production
      PORT: "8000"
      DATABASE_URL: sqlite:////srv/data/srp.sqlite3
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:19732,http://127.0.0.1:19732}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      UNIVERSE: ${UNIVERSE:-hs300}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_CRON_INTRADAY: "${SCHEDULER_CRON_INTRADAY:-*/10 9-11,13-15 * * mon-fri}"
      SCHEDULER_CRON_DAILY_CLOSE: "${SCHEDULER_CRON_DAILY_CLOSE:-30 16 * * mon-fri}"
      SCHEDULER_CRON_DAILY_EVENING: "${SCHEDULER_CRON_DAILY_EVENING:-0 19 * * mon-fri}"
      SCHEDULER_CRON_WEEKLY_MASTER: "${SCHEDULER_CRON_WEEKLY_MASTER:-0 8 * * mon}"
      SCHEDULER_CRON_WEEKLY_FINANCIALS: "${SCHEDULER_CRON_WEEKLY_FINANCIALS:-0 12 * * sat}"
      INGEST_BOOTSTRAP: ${INGEST_BOOTSTRAP:-true}
      INGEST_BOOTSTRAP_STALE_DAYS: ${INGEST_BOOTSTRAP_STALE_DAYS:-3}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      FEATURE_AI: ${FEATURE_AI:-false}
      FEATURE_MCP: ${FEATURE_MCP:-true}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    ports:
      - "${BACKEND_PORT:-19731}:8000"
    volumes:
      - ../data:/srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    image: srp-frontend:latest
    container_name: srp-frontend
    ports:
      - "${FRONTEND_PORT:-19732}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
